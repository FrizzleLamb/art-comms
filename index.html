<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>@FrizzleLamb</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 32px 16px 80px;
    background: #83E1D7;
    gap: 32px;
    font-family: "Comic Sans MS", "Comic Sans";
  }

  /* header */
  .header {
    text-align: center;
  }
  .header h1 {
    margin: 0;
    font-size: 32px;
    color: #063B26;
  }
  .header p {
    margin: 6px 0 0;
    font-size: 16px;
    color: #0a5c40;
  }

  /* main 3-column layout */
  .main-layout {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
  }

  /* socials box, left */
  .socials-box {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 40px;
  }
  .socials-box span.label {
    font-size: 12px;
    color: #0a5c40;
    font-weight: bold;
    margin-top: 6px;
    margin-bottom: -2px;
  }
  .socials-box span.label:first-child {
    margin-top: 0;
  }
  .socials-box a {
    text-decoration: none;
    color: #3d5c38;
    background: #f0f7ee;
    border: 2px solid #a8d5a2;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 14px;
    font-family: inherit;
    text-align: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .socials-box a:hover {
    background: #dcedd8;
    border-color: #6b9b63;
  }

  /* center: donut */
  #donut-container {
    position: relative;
    width: 300px;
    height: 300px;
    max-width: 80vw;
    max-height: 80vw;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
    flex-shrink: 0;
  }
  #donut {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #fcdbac;
    box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.25);
    position: relative;
  }
  #donut::after {
  content: "";
  position: absolute;
  top: 41%;
  left: 41%;
  width: 18%;
  height: 18%;
  background: #83E1D7;
  border-radius: 50%;
  box-shadow: inset 0 5px 10px rgba(0,0,0,0.08), 0 0 10px rgba(0,0,0,0.12);
}
  #frosting-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #frosting-hole {
    filter: url(#squiggly) drop-shadow(0 0 3px rgba(0, 0, 0, 0.15));
  }
  .sprinkle {
    position: absolute;
    width: 4px;
    height: 17px;
    border-radius: 2px;
    pointer-events: none;
    transform-origin: center;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  }
  .sprinkle.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* right: controls box */
  .controls-box {
    width: 180px;
    padding: 16px;
    border: 2px solid #e8c873;
    border-radius: 10px;
    background: #fdf6e3;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .control-group span.label {
    font-size: 12px;
    color: #6b5423;
    font-weight: bold;
  }

  /* BUTTONS */
  button.option-btn {
    padding: 6px 12px;
    border: 2px solid #e8c873;
    border-radius: 6px;
    background: #fdf6e3;
    color: #6b5423;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
    transition: background 0.15s, border-color 0.15s;
  }
  button.option-btn:hover {
    background: #f7ecc8;
  }
  button.option-btn.active {
    border-color: #d4a017;
    background: #f2dd97;
    color: #4a3a10;
    font-weight: bold;
  }

  /* timer */
  #time-wasted {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: red;
    font-family: "Comic Sans MS", "Comic Sans";
    font-size: 14px;
    margin: 0;
    text-align: center;
    padding: 0 12px;
  }

  /* ts should be the mobile fix */
  @media (max-width: 700px) {
    body {
      padding: 24px 12px 90px;
      gap: 24px;
    }
    .header h1 {
      font-size: 26px;
    }
    .header p {
      font-size: 14px;
    }
    .main-layout {
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .socials-box {
      padding-top: 0;
      order: 2;
    }
    #donut-container {
      order: 1;
    }
    .controls-box {
      order: 3;
    }
    #time-wasted {
      font-size: 12px;
    }
  }
</style>
</head>
<body>

<div class="header">
  <h1>@FrizzleLamb</h1>
  <p>Hello! I'm FrizzleLamb. I like to do digital art and eat cheesecakes.</p>
</div>

<div class="main-layout">

  <!-- LEFT: socials -->
  <div class="socials-box">
    <span class="label">where you can commission</span>
    <a href="https://vgen.co/FrizzleLamb">vgen</a>
    <a href="https://ko-fi.com/frizzlelamb">ko-fi</a>
    <a href="https://paypal.me/frizzleshillings">paypal</a>
    <span class="label">where i post art</span>
    <a href="https://x.com/FrizzleLamb">twitter</a>
    <a href="https://bsky.app/profile/frizzlelamb.bsky.social">bluesky</a>
    <a href="https://www.pixiv.net/en/users/65300551">pixiv</a>
  </div>

  <!-- CENTER: donut -->
  <div id="donut-container">
    <div id="donut"></div>
    <svg id="frosting-svg" viewBox="0 0 300 300">
      <defs>
  <filter id="squiggly" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="7" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <radialGradient id="hole-shadow-gradient" cx="50%" cy="50%" r="50%">
  <stop offset="55%" stop-color="#83E1D7" stop-opacity="1" />
  <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
</radialGradient>
</defs>
<circle id="frosting-main" cx="150" cy="150" r="140" fill="#ff8fc7" filter="url(#squiggly)" />
<circle cx="150" cy="150" r="140" fill="url(#frosting-shadow-gradient)" filter="url(#squiggly)" pointer-events="none" />
<circle id="frosting-hole" cx="150" cy="150" r="27" fill="#83E1D7" />
    </svg>
  </div>

  <!-- RIGHT: controls -->
  <div class="controls-box">
    <div class="control-group">
      <span class="label">frosting</span>
      <button class="option-btn active" data-frosting="#ff8fc7">pink</button>
      <button class="option-btn" data-frosting="#6b3f2a">chocolate</button>
      <button class="option-btn" data-frosting="#fbeeda">vanilla</button>
    </div>
    <div class="control-group">
      <span class="label">topping</span>
      <button class="option-btn active" data-shape="long">sprinkles</button>
      <button class="option-btn" data-shape="dot">nonpareils</button>
    </div>
    <div class="control-group">
      <span class="label">dough</span>
      <button class="option-btn active" data-dough="#fcdbac">regular</button>
      <button class="option-btn" data-dough="#4e321d">chocolate</button>
      <button class="option-btn" data-dough="#8c211d">red velvet</button>
    </div>
  </div>

</div>

<div id="time-wasted">time wasted since you opened this website: 00:00:00 - version 1.1</div>

<!-- le toppings -->
<script>
const container = document.getElementById('donut-container');
const frostingMain = document.getElementById('frosting-main');
const colors = ['#f7f4f4', '#fff562', '#2799d8', '#39a126', '#e7484c', '#ff741a', '#402626', '#ff4fa7',];
let currentShape = 'long';
document.querySelectorAll('[data-frosting]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-frosting]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    frostingMain.setAttribute('fill', btn.dataset.frosting);
  });
});
document.querySelectorAll('[data-shape]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-shape]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentShape = btn.dataset.shape;
  });
});

container.addEventListener('click', (e) => {
  const rect = container.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;
  const dx = x - centerX;
  const dy = y - centerY;
  const distance = Math.sqrt(dx * dx + dy * dy);
  const holeRadius = rect.width * 0.09;
  if (distance < holeRadius) {
    return;
  }

  const roll = Math.random();
  let sprinkleCount;
  if (roll < 0.6) {
    sprinkleCount = 1;
  } else if (roll < 0.9) {
    sprinkleCount = 2;
  } else {
    sprinkleCount = 3;
  }

  for (let i = 0; i < sprinkleCount; i++) {
    const offsetX = x + (Math.random() * 16 - 8);
    const offsetY = y + (Math.random() * 16 - 8);

    const sprinkle = document.createElement('div');
    sprinkle.className = currentShape === 'dot' ? 'sprinkle dot' : 'sprinkle';
    sprinkle.style.left = `${offsetX}px`;
    sprinkle.style.top = `${offsetY}px`;
    sprinkle.style.background = colors[Math.floor(Math.random() * colors.length)];
    if (currentShape === 'long') {
      sprinkle.style.transform = `rotate(${Math.random() * 360}deg)`;
    }
    container.appendChild(sprinkle);
  }
});

const startTime = Date.now();
const timeWastedEl = document.getElementById('time-wasted');

function updateTimer() {
  const elapsedMs = Date.now() - startTime;
  const totalSeconds = Math.floor(elapsedMs / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  const pad = (num) => String(num).padStart(2, '0');
  timeWastedEl.textContent = `time wasted since you opened this website: ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
}

setInterval(updateTimer, 1000);

const donut = document.getElementById('donut');

document.querySelectorAll('[data-dough]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-dough]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    donut.style.background = btn.dataset.dough;
  });
});
</script>
</body>
</html>
